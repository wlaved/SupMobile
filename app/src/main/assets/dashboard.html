<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sup! Dashboard</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
        .btn { display: inline-block; padding: 20px 40px; margin: 20px; background: #6200ea; color: #fff; text-decoration: none; border-radius: 10px; font-size: 1.2em; cursor: pointer;}
        .btn:hover { background: #7c4dff; }
        .status-box { margin-top: 20px; color: #03dac6; font-family: monospace; font-size: 1.1em; border: 1px solid #333; padding: 10px; }
        #fileList { text-align: left; background: #1e1e1e; padding: 10px; margin: 20px auto; max-width: 80%; max-height: 200px; overflow-y: auto; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Sup! Mobile Dashboard</h1>

    <div>
        <div class="btn" onclick="openSocial()">Social Feed</div>
        <div class="btn" onclick="openBrowser()">Object Browser</div>
    </div>

    <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
        <h3>Storage & Node</h3>
        <div class="btn" style="background: #03dac6; color: #000;" onclick="selectStorage()">Select Storage Folder</div>
        <div class="btn" style="background: #cf6679;" onclick="listFiles()">Scan Files</div>
    </div>

    <div id="nodeStatus" class="status-box">Node: Starting...</div>
    <div id="storagePath" class="status-box">Storage: None</div>
    <div id="fileList"></div>

    <script>
        function openSocial() { window.location.href = "SupThread.html"; }
        function openBrowser() { window.location.href = "index.html"; }

        function selectStorage() {
            if (window.SupApp) {
                window.SupApp.selectStorage();
            } else {
                alert("Bridge not active");
            }
        }

        function listFiles() {
            if (window.SupApp) {
                document.getElementById('fileList').innerText = "Scanning...";
                var files = window.SupApp.listFiles("");
                try {
                    var fileArr = JSON.parse(files);
                    var html = "<strong>Files Found: " + fileArr.length + "</strong><br/>";
                    fileArr.forEach(f => {
                         html += "<div>" + f + "</div>";
                    });
                    document.getElementById('fileList').innerHTML = html;
                } catch(e) {
                    document.getElementById('fileList').innerText = files;
                }
            }
        }

        // Poll Node Status
        setInterval(() => {
            if (window.SupApp) {
                document.getElementById('nodeStatus').innerText = "Node: " + window.SupApp.getNodeStatus();
            }
        }, 2000);

        // Initialize
        if (window.SupApp) {
            var path = window.SupApp.getStoragePath();
            if (path) {
                document.getElementById('storagePath').innerText = "Storage: " + path;
            } else {
                document.getElementById('storagePath').innerText = "Storage: Not Selected";
            }
        } else {
            document.getElementById('nodeStatus').innerText = "Web Mode (No Bridge)";
        }
    </script>
</body>
</html>
