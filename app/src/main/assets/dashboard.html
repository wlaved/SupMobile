<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sup Dashboard</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #bb86fc;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 300px;
            margin: 0 auto;
        }
        button {
            padding: 15px;
            background-color: #333;
            color: #bb86fc;
            border: 1px solid #bb86fc;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #bb86fc;
            color: #121212;
        }
        .status-panel {
            margin-top: 30px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 10px;
            text-align: left;
        }
        .status-item {
            margin: 10px 0;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
        }
        .tab-bar {
            display: flex;
            border-bottom: 1px solid #444;
            margin-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: #bb86fc;
            border-bottom: 2px solid #bb86fc;
        }
    </style>
</head>
<body>
    <h1>Sup Dashboard</h1>

    <div style="margin-bottom: 30px;">
        <h3>Unified Search</h3>
        <input type="text" id="unifiedSearchInput" placeholder="Search IPFS, URN, #Keyword, or TXID..." style="width: 80%; padding: 12px; border-radius: 20px; border: 1px solid #bb86fc; background: #333; color: white;">
        <button onclick="doUnifiedSearch()" style="padding: 12px 20px; border-radius: 20px; margin-left: 5px;">Go</button>
    </div>

    <div class="button-container">
        <button onclick="requestPermissions()" style="border-color: #03dac6; color: #03dac6;">Grant App Permissions</button>
        <button onclick="startNode()">Start Node</button>
        <button onclick="stopNode()">Stop Node</button>

        <div style="border: 1px solid #444; padding: 10px; border-radius: 8px;">
            <div style="font-size: 0.9em; margin-bottom: 5px;">Import Tools</div>
            <button onclick="scanBlockchain()" style="border-color: #bb86fc; color: #bb86fc; width: 48%;">Import</button>
            <button onclick="stopScan()" style="border-color: #cf6679; color: #cf6679; width: 48%;">Stop</button>
            <label style="display: block; margin-top: 8px; font-size: 0.8em; color: #b0b0b0;">
                <input type="checkbox" id="autoScanToggle" onchange="toggleAutoScan()"> Auto-Import on Startup
            </label>
        </div>
    </div>

    <div class="status-panel">
        <h3>Node Status</h3>
        <div class="status-item">State: <span id="nodeState">Stopped</span></div>
        <div class="status-item">Peers: <span id="peerCount">0</span></div>
        <div class="status-item">Height: <span id="chainHeight">0</span></div>
        <div class="status-item">Storage: <span id="storagePath">Internal</span></div>
        <div class="status-item" style="color:#03dac6;">Indexed Messages: <span id="dbMsgCount">0</span></div>
        <div class="status-item" style="color:#03dac6;">Indexed Profiles: <span id="dbProfileCount">0</span></div>

        <div style="margin-top: 20px;">
            <label>Manual Storage Path (Select 'SUP' Folder):</label>
            <input type="text" id="manualPathInput" placeholder="/mnt/media_rw/.../SUP">
            <button onclick="setManualPath()" style="margin-top: 10px; width: 100%;">Set Path</button>
        </div>

        <div style="margin-top: 20px;">
             <label><input type="checkbox" id="networkToggle" onchange="toggleNetwork()"> Use Mainnet</label>
        </div>
    </div>

    <!-- Live Social Feed -->
    <div class="status-panel" style="text-align: left;">
        <h3>Social Feed</h3>
        <div class="tab-bar">
            <button class="tab-btn active" id="tabAll" onclick="switchFeed('all')">All Activity</button>
            <button class="tab-btn" id="tabWatched" onclick="switchFeed('watched')">Watched / Following</button>
        </div>
        <div id="socialFeed" style="max-height: 300px; overflow-y: auto;">
            <div id="emptyFeed" style="color: #666; font-style: italic;">Loading feed...</div>
        </div>
    </div>

    <!-- System Log (Status & Scanner) -->
    <div class="status-panel" style="text-align: left; font-family: monospace;">
        <h3>System Log</h3>
        <div id="systemLog" style="height: 100px; overflow-y: auto; font-size: 12px; color: #03dac6; background: #000; padding: 5px;">
            <div>System Ready.</div>
        </div>
    </div>

    <script>
        let currentFeedMode = 'all';

        function updateStatus() {
            if (window.SupApp) {
                const status = JSON.parse(window.SupApp.getNodeStatus());
                document.getElementById('nodeState').textContent = status.running ? "Running" : "Stopped";
                document.getElementById('peerCount').textContent = status.peers;
                document.getElementById('chainHeight').textContent = status.height;
                document.getElementById('storagePath').textContent = status.path || "Not set";

                if (window.SupApp.getDatabaseStats) {
                     const stats = JSON.parse(window.SupApp.getDatabaseStats());
                     document.getElementById('dbMsgCount').textContent = stats.messages;
                     document.getElementById('dbProfileCount').textContent = stats.profiles;
                }
            }
        }

        function requestPermissions() {
            if (window.SupApp) {
                window.SupApp.requestPermissions();
            } else {
                alert("Bridge not active");
            }
        }

        function startNode() {
            if (window.SupApp) {
                window.SupApp.startNode();
            }
        }

        function stopNode() {
            if (window.SupApp) {
                window.SupApp.stopNode();
            }
        }

        function scanBlockchain() {
            if (window.SupApp) {
                window.SupApp.startLocalScan();
            } else {
                alert("Bridge not active");
            }
        }

        function stopScan() {
            if (window.SupApp) {
                window.SupApp.stopLocalScan();
            }
        }

        function setManualPath() {
            const path = document.getElementById('manualPathInput').value;
            if (window.SupApp) {
                window.SupApp.setManualStoragePath(path);
                alert("Path set to: " + path);
            }
        }

        function toggleNetwork() {
            const isMainnet = document.getElementById('networkToggle').checked;
            if (window.SupApp && window.SupApp.setNetwork) {
                window.SupApp.setNetwork(isMainnet);
            }
            console.log("Network switched to " + (isMainnet ? "Mainnet" : "Testnet"));
            loadCachedFeed(); // Reload feed for new network
        }

        function toggleAutoScan() {
            const enabled = document.getElementById('autoScanToggle').checked;
            if (window.SupApp && window.SupApp.setAutoScan) {
                window.SupApp.setAutoScan(enabled);
            }
        }

        function doUnifiedSearch() {
            const input = document.getElementById('unifiedSearchInput').value.trim();
            const isMainnet = document.getElementById('networkToggle').checked;

            if (!input) return;

            // 1. Check for IPFS (Qm... or ipfs://)
            if (input.startsWith('Qm') || input.toLowerCase().startsWith('ipfs:')) {
                if (window.SupApp) {
                    window.SupApp.pinIpfs(input);
                    alert("Pinning IPFS content locally...");
                } else {
                    alert("Bridge not ready.");
                }
                return;
            }

            // 2. Check for Transaction ID (64 hex chars) -> Object Browser
            if (/^[a-fA-F0-9]{64}$/.test(input)) {
                window.location.href = `index.html?tid=${input}&mainnet=${isMainnet}`;
                return;
            }

            // 3. Check for Keywords (#hashtag) -> Social Thread
            if (input.startsWith('#')) {
                window.location.href = `SupThread.html?urn=${encodeURIComponent(input)}&mainnet=${isMainnet}`;
                return;
            }

            // 4. Default: Treat as URN/Address -> Social Thread (Profile)
            window.location.href = `SupThread.html?urn=${encodeURIComponent(input)}&mainnet=${isMainnet}`;
        }

        // Poll for status every 2 seconds
        setInterval(updateStatus, 2000);

        // Initial status load
        window.addEventListener('load', () => {
            updateStatus();
            loadCachedFeed();
        });

        function switchFeed(mode) {
            currentFeedMode = mode;
            document.getElementById('tabAll').className = mode === 'all' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tabWatched').className = mode === 'watched' ? 'tab-btn active' : 'tab-btn';
            loadCachedFeed();
        }

        function loadCachedFeed() {
            const feed = document.getElementById('socialFeed');
            feed.innerHTML = '<div id="emptyFeed" style="color: #666; font-style: italic;">Loading...</div>';

            if (window.SupApp) {
                try {
                    let data = "[]";
                    if (currentFeedMode === 'watched' && window.SupApp.getWatchedFeed) {
                        data = window.SupApp.getWatchedFeed(50);
                    } else if (window.SupApp.getSocialFeed) {
                        data = window.SupApp.getSocialFeed(50);
                    }

                    const messages = JSON.parse(data);

                    feed.innerHTML = '';
                    if (messages.length === 0) {
                        feed.innerHTML = '<div id="emptyFeed" style="color: #666; font-style: italic;">No recent messages found.</div>';
                    } else {
                        messages.forEach(msg => {
                            addPostToFeed(msg, false); // false = append (for history)
                        });
                    }
                } catch(e) {
                    console.error("Error loading cached feed: " + e);
                    feed.innerHTML = '<div id="emptyFeed" style="color: #cf6679;">Error loading feed.</div>';
                }
            }
        }

        function addPostToFeed(msg, prepend = true) {
             const feed = document.getElementById('socialFeed');
             const empty = document.getElementById('emptyFeed');
             if (empty) empty.style.display = 'none';

             // Client-side filtering check for live events
             if (currentFeedMode === 'watched') {
                  // If message object doesn't have explicit 'is_watched' or 'watched' flag,
                  // we might be showing unwanted data.
                  // For DB data (cached), getWatchedFeed filters it.
                  // For Live data, we check msg.watched.
                  if (msg.watched === false || msg.watched === 0) return;
             }

             const card = document.createElement('div');
             card.className = "post-card";
             card.dataset.watched = msg.watched;

             card.style.background = (msg.watched || currentFeedMode === 'watched') ? "#2a2a2a" : "#1e1e1e";
             card.style.padding = "10px";
             card.style.marginBottom = "8px";
             card.style.borderRadius = "5px";
             if (msg.watched) {
                 card.style.borderLeft = "3px solid #03dac6";
             }

             let contentHtml = msg.content || msg.Message || ""; // Handle different JSON keys
             // DB returns 'Message', live returns 'content'. Normalize?
             // Helper returns "Message" (Caps). Live returns "content".
             // Let's normalize.

             if (contentHtml.startsWith("IPFS:")) {
                  const hash = contentHtml.substring(5);
                  contentHtml = `<img src="http://127.0.0.1:8080/ipfs/${hash}" style="max-width:100%; max-height:200px; display:block; margin-top:5px;">`;
             }

             // DB returns FromAddress, live returns sender.
             const sender = msg.sender || msg.FromAddress || "Unknown";
             const txid = msg.txid || msg.TransactionId || "???";

             card.innerHTML = `
                 <div style="font-size:0.8em; color:#bb86fc;">${sender} <span style="float:right; color:#888;">${new Date().toLocaleTimeString()}</span></div>
                 <div style="margin-top:5px; color:#e0e0e0;">${contentHtml}</div>
                 <div style="font-size:0.7em; color:#666; margin-top:5px;">TXID: ${txid.substring(0,8)}...</div>
             `;

             card.onclick = () => showMessageDetails(msg);
             card.style.cursor = "pointer";

             if (prepend) {
                 feed.prepend(card);
             } else {
                 feed.appendChild(card);
             }
        }

        function showMessageDetails(msg) {
             const sender = msg.sender || msg.FromAddress || "Unknown";
             const txid = msg.txid || msg.TransactionId || "???";
             const time = msg.timestamp ? new Date(msg.timestamp).toLocaleString() : new Date().toLocaleString();
             const content = msg.content || msg.Message || "";

             const modal = document.createElement('div');
             modal.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:1000;";
             modal.innerHTML = `
                 <div style="background:#1e1e1e; padding:20px; border-radius:10px; max-width:90%; max-height:80%; overflow-y:auto; text-align:left; border:1px solid #bb86fc;">
                     <h3 style="color:#bb86fc; margin-top:0;">Message Details</h3>
                     <p><strong>From:</strong> ${sender}</p>
                     <p><strong>Date:</strong> ${time}</p>
                     <p><strong>TXID:</strong> <a href="index.html?tid=${txid}" style="color:#03dac6;">${txid}</a></p>
                     <hr style="border-color:#333;">
                     <div style="white-space:pre-wrap; word-break:break-word;">${content.replace(/</g, "&lt;")}</div>
                     <button onclick="this.parentElement.parentElement.remove()" style="margin-top:20px; width:100%; background:#333; color:white; border:none; padding:10px; cursor:pointer;">Close</button>
                 </div>
             `;
             document.body.appendChild(modal);
        }

        // Bridge Callback
        window.onSupEvent = function(type, data) {
            console.log("SupEvent: " + type + " - " + data);

            if (type === 'system_log' || type === 'live_feed') {
                const logDiv = document.getElementById('systemLog');
                const entry = document.createElement('div');
                const time = new Date().toLocaleTimeString();
                entry.textContent = `[${time}] ${data}`;
                logDiv.prepend(entry);
                if (logDiv.children.length > 50) logDiv.removeChild(logDiv.lastChild);
            }

            if (type === 'new_post') {
                try {
                    const msg = JSON.parse(data);
                    addPostToFeed(msg, true); // true = prepend (for live)
                } catch(e) {
                    console.error("Failed to parse post: " + e);
                }
            }
        };
    </script>
</body>
</html>
